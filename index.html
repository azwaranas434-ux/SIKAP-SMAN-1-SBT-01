<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIKAP — SMA Negeri 1 Seram Bagian Timur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --bg: #F5F2EA;
  --surface: #FFFFFF;
  --surface-2: #FBF9F4;
  --ink: #1D2B29;
  --muted: #6E7873;
  --line: #E4DFCF;
  --primary: #0E3A39;
  --primary-light: #17534F;
  --primary-dark: #082423;
  --accent: #C97A2B;
  --accent-soft: #F1DCB8;
  --accent-soft-2: #FBF0DC;
  --danger: #B3452B;
  --danger-soft: #F6DFD6;
  --success: #3F7D58;
  --success-soft: #DCEBE0;
  --warn: #B08A1F;
  --warn-soft: #F3E6C4;
  --radius: 10px;
  --shadow: 0 2px 10px rgba(14,58,57,0.06), 0 1px 2px rgba(14,58,57,0.08);
  --shadow-lg: 0 12px 32px rgba(14,58,57,0.16);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.display{font-family:'Poppins',sans-serif;}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit;}
::selection{background:var(--accent-soft);}

/* ===== Layout ===== */
#app{display:flex;min-height:100vh;}

/* Sidebar */
.sidebar{
  width:264px;
  flex-shrink:0;
  background:var(--primary-dark);
  background-image:
    radial-gradient(circle at 85% 8%, rgba(201,122,43,0.18), transparent 45%),
    linear-gradient(180deg, var(--primary-dark), var(--primary));
  color:#EAF3F0;
  display:flex;
  flex-direction:column;
  position:fixed;
  top:0;left:0;bottom:0;
  z-index:40;
  transition:transform .25s ease;
}
.brand{
  padding:22px 20px 16px;
  border-bottom:1px solid rgba(255,255,255,0.1);
  display:flex;
  gap:12px;
  align-items:center;
}
.seal{
  width:46px;height:46px;border-radius:50%;
  background:conic-gradient(from 90deg, var(--accent), #E8A33D, var(--accent));
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  box-shadow: inset 0 0 0 3px rgba(255,255,255,0.15), 0 2px 6px rgba(0,0,0,0.25);
  overflow:hidden;
}
.seal img{width:100%;height:100%;object-fit:cover;}
.seal span{font-family:'Poppins',sans-serif;font-weight:800;color:var(--primary-dark);font-size:15px;}
.brand-text .school-name{font-family:'Poppins',sans-serif;font-weight:700;font-size:13.5px;line-height:1.3;}
.brand-text .school-sub{font-size:11px;color:rgba(234,243,240,0.65);margin-top:2px;letter-spacing:.03em;}

.nav-ledger{
  padding:14px 10px 20px;
  overflow-y:auto;
  flex:1;
}
.nav-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 12px;
  margin:2px 4px;
  border-radius:8px;
  cursor:pointer;
  color:rgba(234,243,240,0.82);
  font-size:13.5px;
  font-weight:500;
  position:relative;
  transition:background .15s, color .15s;
  user-select:none;
}
.nav-item .idx{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:rgba(234,243,240,0.4);
  width:18px;
  flex-shrink:0;
}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-item.active{color:#fff;}
.nav-item.active .idx{color:var(--accent);}
.nav-divider{height:1px;background:rgba(255,255,255,0.08);margin:10px 14px;}

.sidebar-foot{
  padding:14px 20px 18px;
  border-top:1px solid rgba(255,255,255,0.1);
  font-size:11px;
  color:rgba(234,243,240,0.5);
}

/* Main */
.main{
  margin-left:264px;
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}
.topbar{
  position:sticky;top:0;z-index:30;
  background:rgba(245,242,234,0.9);
  backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
  padding:16px 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}
.page-title{font-size:20px;font-weight:700;margin:0;}
.page-sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
.topbar-right{display:flex;align-items:center;gap:14px;}
.date-chip{
  font-size:12px;color:var(--muted);
  background:var(--surface);
  border:1px solid var(--line);
  padding:7px 12px;border-radius:20px;
  font-family:'JetBrains Mono',monospace;
}
.menu-toggle{display:none;}

.content{padding:24px 28px 60px;flex:1;}

/* ===== Reusable components ===== */
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.card-pad{padding:20px;}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.section-head h3{margin:0;font-size:15.5px;}

.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:9px 16px;
  border-radius:8px;
  border:1px solid transparent;
  font-size:13.5px;font-weight:600;
  cursor:pointer;
  transition:transform .08s ease, filter .15s;
  white-space:nowrap;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-light);}
.btn-accent{background:var(--accent);color:#fff;}
.btn-accent:hover{filter:brightness(1.06);}
.btn-outline{background:transparent;border-color:var(--line);color:var(--ink);}
.btn-outline:hover{background:var(--surface-2);}
.btn-tint:hover{filter:brightness(1.08);}
.btn-danger-ghost{background:transparent;color:var(--danger);border-color:var(--danger-soft);}
.btn-danger-ghost:hover{background:var(--danger-soft);}
.btn-sm{padding:6px 11px;font-size:12.5px;}
.btn-icon{padding:7px;border-radius:7px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;}
.badge-success{background:var(--success-soft);color:var(--success);}
.badge-danger{background:var(--danger-soft);color:var(--danger);}
.badge-warn{background:var(--warn-soft);color:var(--warn);}
.badge-muted{background:var(--surface-2);color:var(--muted);border:1px solid var(--line);}
.badge-accent{background:var(--accent-soft-2);color:var(--accent);}

table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;
  color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:2px solid var(--line);
  white-space:nowrap;
}
tbody td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
tbody tr:hover{background:var(--surface-2);}
.table-wrap{overflow-x:auto;}
.cell-strong{font-weight:600;}
.cell-mono{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--muted);}
.row-actions{display:flex;gap:6px;}

.empty-state{
  text-align:center;padding:50px 20px;color:var(--muted);
}
.empty-state svg{width:44px;height:44px;opacity:.35;margin-bottom:10px;}
.empty-state .et{font-weight:600;color:var(--ink);margin-bottom:4px;}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px;}
.stat-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 18px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.stat-card .stat-label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
.stat-card .stat-value{font-family:'Poppins',sans-serif;font-size:28px;font-weight:700;margin-top:6px;}
.stat-card .stat-foot{font-size:11.5px;color:var(--muted);margin-top:6px;}
.stat-card .stat-icon{
  position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
}
.stat-icon svg{width:17px;height:17px;}

.grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;}
.filter-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}

input,select,textarea{
  font-family:'Inter',sans-serif;
  font-size:13.5px;
  padding:9px 12px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  outline:none;
  width:100%;
}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(14,58,57,0.08);}
label{font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:5px;display:block;}
.field{margin-bottom:14px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.search-input{position:relative;min-width:220px;flex:1;}
.search-input svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted);}
.search-input input{padding-left:34px;}

/* Modal */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(14,20,20,0.5);
  display:flex;align-items:center;justify-content:center;
  z-index:100;padding:20px;
  animation:fadeIn .15s ease;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal{
  background:var(--surface);border-radius:14px;
  width:100%;max-width:560px;max-height:88vh;
  display:flex;flex-direction:column;
  box-shadow:var(--shadow-lg);
  animation:modalIn .18s ease;
}
@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.98);}to{opacity:1;transform:none;}}
.modal.modal-wide{max-width:820px;}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{margin:0;font-size:16px;}
.modal-body{padding:20px 22px;overflow-y:auto;}
.modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}
.close-x{cursor:pointer;background:none;border:none;padding:4px;color:var(--muted);border-radius:6px;}
.close-x:hover{background:var(--surface-2);}

/* Toast */
#toast-wrap{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:10px;}
.toast{
  background:var(--primary-dark);color:#fff;padding:12px 18px;border-radius:9px;
  font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);
  display:flex;align-items:center;gap:9px;
  animation:toastIn .2s ease;min-width:220px;
}
.toast.toast-danger{background:var(--danger);}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* Attendance grid */
.att-list{display:flex;flex-direction:column;gap:8px;}
.att-row{
  display:flex;align-items:center;gap:12px;
  padding:10px 14px;border:1px solid var(--line);border-radius:9px;background:var(--surface);
}
.att-row .att-num{width:24px;color:var(--muted);font-size:12px;font-family:'JetBrains Mono',monospace;}
.att-row .att-name{flex:1;font-weight:600;font-size:13.5px;}
.att-row .att-nis{font-size:11.5px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
.seg{display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:8px;}
.seg button{
  border:none;background:transparent;padding:6px 11px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted);
}
.seg button.on-hadir.active{background:var(--success);color:#fff;}
.seg button.on-izin.active{background:var(--warn);color:#fff;}
.seg button.on-sakit.active{background:#7A5FB0;color:#fff;}
.seg button.on-alpa.active{background:var(--danger);color:#fff;}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;}
.tab-btn{
  padding:10px 4px;margin-right:20px;border:none;background:none;cursor:pointer;
  font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;
}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--accent);}

.pill-nav{display:flex;gap:6px;flex-wrap:wrap;}
.pill-nav button{
  padding:7px 13px;border-radius:20px;border:1px solid var(--line);background:var(--surface);
  font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;
}
.pill-nav button.active{background:var(--primary);border-color:var(--primary);color:#fff;}

.avatar-init{
  width:32px;height:32px;border-radius:50%;background:var(--accent-soft-2);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex-shrink:0;
}
.note-card{border-left:3px solid var(--accent);background:var(--surface);border:1px solid var(--line);border-left-width:3px;border-radius:9px;padding:14px 16px;margin-bottom:10px;}
.note-card .note-meta{font-size:11.5px;color:var(--muted);margin-top:4px;}

.print-only{display:none;}
@media print{
  .sidebar,.topbar,.no-print{display:none !important;}
  .main{margin-left:0 !important;}
  .content{padding:0 !important;}
  body{background:#fff !important;}
  .print-only{display:block;}
}

.hint{font-size:12px;color:var(--muted);margin-top:6px;}
.divider{height:1px;background:var(--line);margin:18px 0;}

@media (max-width: 980px){
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .grid-2{grid-template-columns:1fr;}
  .field-row{grid-template-columns:1fr;}
}
@media (max-width: 760px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .menu-toggle{display:flex;}
  .stat-grid{grid-template-columns:1fr 1fr;}
  .topbar{padding:14px 16px;}
  .content{padding:16px 16px 60px;}
}
</style>
</head>
<body>

<div id="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="btn btn-icon btn-outline menu-toggle" id="menuToggle" aria-label="Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div>
          <h1 class="page-title" id="pageTitle">Dashboard</h1>
          <div class="page-sub" id="pageSub">Ringkasan aktivitas sekolah</div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="date-chip" id="dateChip"></div>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-wrap"></div>

/* ---------- Storage layer ----------
   Prioritas: window.storage (bila berjalan sebagai Artifact Claude.ai, data bisa dibagi
   antar pengguna). Jika tidak tersedia (mis. file ini dibuka langsung/di-hosting sendiri
   di luar Claude.ai), otomatis memakai localStorage browser agar data TETAP TERSIMPAN
   permanen di perangkat/browser tersebut dan tidak perlu diimpor ulang setiap dibuka. */
const CLOUD_STORAGE_AVAILABLE = (typeof window.storage !== "undefined" && window.storage !== null);

function localGet(key){
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function localSet(key, value){
  try{
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  }catch(e){ console.error("localStorage set failed", key, e); return false; }
}

async function storageGet(key){
  if(CLOUD_STORAGE_AVAILABLE){
    try{
      const res = await window.storage.get(key, true);
      return res ? JSON.parse(res.value) : null;
    }catch(e){ return localGet(key); }
  }
  return localGet(key);
}
async function storageSet(key, value){
  if(CLOUD_STORAGE_AVAILABLE){
    try{
      await window.storage.set(key, JSON.stringify(value), true);
      return true;
    }catch(e){ console.error("storage set failed", key, e); return localSet(key, value); }
  }
  return localSet(key, value);
}

async function loadAll(){
  const s = await storageGet("app:settings");
  state.settings = s ? {...DEFAULT_SETTINGS, ...s} : {...DEFAULT_SETTINGS};
  for(const k of MODULE_KEYS){
    const d = await storageGet("app:"+k);
    state[k] = Array.isArray(d) ? d : [];
  }
}
async function saveModule(k){
  if(k === "settings") return storageSet("app:settings", state.settings);
  return storageSet("app:"+k, state[k]);
}

/* ---------- Utilities ---------- */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function esc(str){
  if(str===undefined || str===null) return "";
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmtDate(d){
  if(!d) return "-";
  const dt = new Date(d+"T00:00:00");
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
}
function todayISO(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function findKelas(id){ return state.kelas.find(k=>k.id===id); }
function findSiswa(id){ return state.siswa.find(s=>s.id===id); }
function findMapel(id){ return state.mapel.find(m=>m.id===id); }
function kelasLabel(id){ const k=findKelas(id); return k ? k.nama : "-"; }
function siswaLabel(id){ const s=findSiswa(id); return s ? s.nama : "-"; }
function mapelLabel(id){ const m=findMapel(id); return m ? m.nama : "-"; }
function siswaByKelas(kelasId){
  return state.siswa.filter(s=>s.kelasId===kelasId && s.status!=="Pindah" && s.status!=="Lulus")
    .sort((a,b)=>a.nama.localeCompare(b.nama));
}
function initials(name){
  if(!name) return "?";
  const parts = name.trim().split(/\s+/);
  return (parts[0][0]+(parts[1]?parts[1][0]:'')).toUpperCase();
}

function toast(msg, danger=false){
  const wrap = document.getElementById("toast-wrap");
  const el = document.createElement("div");
  el.className = "toast"+(danger?" toast-danger":"");
  el.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="${danger?'M12 9v4M12 17h.01M10.29 3.86l-8.18 14.14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.89-3L13.71 3.86a2 2 0 0 0-3.42 0Z':'M20 6 9 17l-5-5'}"/></svg><span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transition="opacity .25s"; setTimeout(()=>el.remove(),250); }, 2600);
}

function closeModal(){
  document.getElementById("modal-root").innerHTML = "";
}
function openModal({title, wide=false, bodyHtml, footHtml, onMount}){
  const root = document.getElementById("modal-root");
  root.innerHTML = `
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal ${wide?'modal-wide':''}">
        <div class="modal-head">
          <h3>${esc(title)}</h3>
          <button class="close-x" onclick="closeModal()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="modal-body">${bodyHtml}</div>
        <div class="modal-foot">${footHtml||''}</div>
      </div>
    </div>`;
  document.getElementById("modalBackdrop").addEventListener("click",(e)=>{
    if(e.target.id==="modalBackdrop") closeModal();
  });
  if(onMount) onMount();
}
function confirmDelete(msg, onYes){
  openModal({
    title:"Konfirmasi Hapus",
    bodyHtml:`<p style="margin:0;color:var(--ink);font-size:13.5px;">${esc(msg)}</p>`,
    footHtml:`<button class="btn btn-outline" onclick="closeModal()">Batal</button>
              <button class="btn" style="background:var(--danger);color:#fff;" id="confirmYesBtn">Hapus</button>`,
    onMount:()=>{
      document.getElementById("confirmYesBtn").onclick = ()=>{ onYes(); closeModal(); };
    }
  });
}

function icon(name, size=17){
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`;
}

function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

/* =========================================================
   GENERIC CRUD HELPERS
========================================================= */
function renderField(f, val){
  const v = val===undefined || val===null ? (f.default!==undefined?f.default:"") : val;
  if(f.type==="select"){
    const opts = typeof f.options==="function" ? f.options() : f.options;
    return `<select id="f_${f.name}">
      <option value="">— Pilih ${esc(f.label)} —</option>
      ${opts.map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(v)?'selected':''}>${esc(o.label)}</option>`).join("")}
    </select>`;
  }
  if(f.type==="textarea"){
    return `<textarea id="f_${f.name}" rows="${f.rows||3}" placeholder="${esc(f.placeholder||'')}">${esc(v)}</textarea>`;
  }
  return `<input id="f_${f.name}" type="${f.type||'text'}" value="${esc(v)}" placeholder="${esc(f.placeholder||'')}" ${f.step?`step="${f.step}"`:''} ${f.min!==undefined?`min="${f.min}"`:''} ${f.max!==undefined?`max="${f.max}"`:''}>`;
}
function fieldsHtml(fields, item){
  return fields.map(f=>`
    <div class="field">
      <label>${esc(f.label)}${f.required?' <span style="color:var(--danger)">*</span>':''}</label>
      ${renderField(f, item?item[f.name]:undefined)}
      ${f.hint?`<div class="hint">${esc(f.hint)}</div>`:''}
    </div>
  `).join("");
}
function readFields(fields){
  const out = {};
  for(const f of fields){
    const el = document.getElementById("f_"+f.name);
    out[f.name] = el.value;
  }
  return out;
}
function validateRequired(fields, data){
  for(const f of fields){
    if(f.required && !String(data[f.name]||"").trim()){
      toast(`"${f.label}" wajib diisi`, true);
      return false;
    }
  }
  return true;
}

function openCrudModal(cfg, item){
  const isEdit = !!item;
  openModal({
    title: (isEdit?"Ubah ":"Tambah ") + cfg.title,
    wide: cfg.wide,
    bodyHtml: `<div class="${cfg.twoCol?'field-row':''}">${fieldsHtml(cfg.fields, item)}</div>`,
    footHtml: `<button class="btn btn-outline" onclick="closeModal()">Batal</button>
               <button class="btn btn-primary" id="crudSaveBtn">${icon('check',14)} Simpan</button>`,
    onMount: ()=>{
      document.getElementById("crudSaveBtn").onclick = async ()=>{
        const data = readFields(cfg.fields);
        if(!validateRequired(cfg.fields, data)) return;
        if(cfg.onValidate){
          const err = cfg.onValidate(data, item);
          if(err){ toast(err, true); return; }
        }
        if(isEdit){
          Object.assign(item, data);
        } else {
          state[cfg.key].push({id: uid(), ...data});
        }
        await saveModule(cfg.key);
        toast(isEdit?"Perubahan disimpan":"Data berhasil ditambahkan");
        closeModal();
        render();
      };
    }
  });
}

function crudDelete(cfg, id){
  confirmDelete(`Yakin ingin menghapus data ini? Tindakan ini tidak dapat dibatalkan.`, async ()=>{
    state[cfg.key] = state[cfg.key].filter(x=>x.id!==id);
    await saveModule(cfg.key);
    toast("Data dihapus");
    render();
  });
}

function toolbarHtml(cfg, searchVal){
  return `
    <div class="section-head">
      <h3>${cfg.title}</h3>
      <div class="filter-row">
        <div class="search-input">${icon('search',15)}<input id="searchBox" placeholder="Cari..." value="${esc(searchVal||'')}" oninput="onSearchInput(this.value)"></div>
        <button class="btn btn-sm btn-tint" style="background:${MENU_COLORS[cfg.key]||'var(--primary)'};color:#fff;" onclick="openCrudModal(CURRENT_CFG)">${icon('plus',14)} Tambah</button>
      </div>
    </div>`;
}
let CURRENT_CFG = null;
let SEARCH_TERM = "";
function onSearchInput(v){
  SEARCH_TERM = v;
  document.getElementById("content").innerHTML = renderCrudPage(CURRENT_CFG);
}
function renderCrudPage(cfg){
  CURRENT_CFG = cfg;
  let rows = state[cfg.key];
  if(SEARCH_TERM){
    const t = SEARCH_TERM.toLowerCase();
    rows = rows.filter(r => cfg.searchFields.some(f => String(r[f]||"").toLowerCase().includes(t)) );
  }
  if(cfg.applyExtraFilter) rows = cfg.applyExtraFilter(rows);
  rows = cfg.sort ? cfg.sort(rows) : rows;
  return `
    <div class="card card-pad">
      ${toolbarHtml(cfg, SEARCH_TERM)}
      ${cfg.extraFilterHtml ? cfg.extraFilterHtml() : ''}
      ${rows.length ? `
      <div class="table-wrap"><table>
        <thead><tr>${cfg.columns.map(c=>`<th>${esc(c.label)}</th>`).join("")}<th style="text-align:right;">Aksi</th></tr></thead>
        <tbody>
          ${rows.map(r=>`<tr>${cfg.columns.map(c=>`<td class="${c.strong?'cell-strong':''} ${c.mono?'cell-mono':''}">${c.render?c.render(r):esc(r[c.field])}</td>`).join("")}
          <td><div class="row-actions">
            <button class="btn btn-icon btn-sm btn-tint" style="background:${hexToRgba(MENU_COLORS[cfg.key]||'#2563EB',0.12)};color:${MENU_COLORS[cfg.key]||'#2563EB'};border:1px solid ${hexToRgba(MENU_COLORS[cfg.key]||'#2563EB',0.3)};" onclick='openCrudModal(CURRENT_CFG, state.${cfg.key}.find(x=>x.id==="${r.id}"))'>${icon('edit',14)}</button>
            <button class="btn btn-icon btn-danger-ghost btn-sm" onclick='crudDelete(CURRENT_CFG,"${r.id}")'>${icon('trash',14)}</button>
          </div></td>
          </tr>`).join("")}
        </tbody>
      </table></div>
      ` : `<div class="empty-state">${icon(cfg.icon||'dashboard',40)}<div class="et">Belum ada data</div><div>Klik tombol "Tambah" untuk menambahkan data baru.</div></div>`}
    </div>
  `;
}

      <div class="stat-icon" style="background:var(--warn-soft);color:var(--warn);">${icon('mapel',17)}</div>
      <div class="stat-label">Mata Pelajaran</div>
      <div class="stat-value">${totalMapel}</div>
      <div class="stat-foot">Terdaftar di kurikulum</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:${persenHadir===null?'var(--surface-2)':'var(--success-soft)'};color:${persenHadir===null?'var(--muted)':'var(--success)'};">${icon('absensi',17)}</div>
      <div class="stat-label">Kehadiran Hari Ini</div>

      <div class="stat-foot">${absensiHariIni.length ? hadirHariIni+' dari '+absensiHariIni.length+' tercatat hadir' : 'Belum ada absensi hari ini'}</div>

async function saveAbsensi(){
  state.absensi = state.absensi.filter(a=>!(a.tanggal===absSel.tanggal && a.kelasId===absSel.kelasId && a.mapelId===absSel.mapelId));

let nilaiDraft = {};

function pageNilai(){

      </div>

  <div id="nilListWrap"></div>
  `;
}

function loadNilaiDraft(){
  nilaiDraft = {};
  const list = siswaByKelas(nilaiSel.kelasId);
  const mapel = findMapel(nilaiSel.mapelId);
  for(const s of list){
    const existing = state.nilai.find(n=>n.tanggal===nilaiSel.tanggal && n.kelasId===nilaiSel.kelasId && n.mapelId===nilaiSel.mapelId && n.jenis===nilaiSel.jenis && n.siswaId===s.id);
    nilaiDraft[s.id] = existing ? existing.nilai : "";
  }
}

function renderNilaiList(){
  const wrap = document.getElementById("nilListWrap");
  if(!wrap) return;
  if(!nilaiSel.kelasId || !nilaiSel.mapelId){
    wrap.innerHTML = `<div class="card card-pad"><div class="empty-state">${icon('nilai',40)}<div class="et">Pilih kelas dan mata pelajaran</div><div>Daftar siswa akan muncul setelah kelas &amp; mapel dipilih.</div></div></div>`;
    return;
  }
  const list = siswaByKelas(nilaiSel.kelasId);
  const mapel = findMapel(nilaiSel.mapelId);
  const kkm = mapel ? Number(mapel.kkm)||75 : 75;
  if(!list.length){
    wrap.innerHTML = `<div class="card card-pad"><div class="empty-state">${icon('users',40)}<div class="et">Belum ada siswa di kelas ini</div></div></div>`;
    return;
  }
  wrap.innerHTML = `
    <div class="card card-pad">
      <div class="section-head">
        <h3>Input Nilai — ${esc(kelasLabel(nilaiSel.kelasId))} · ${esc(mapelLabel(nilaiSel.mapelId))}</h3>
        <span class="badge badge-accent">KKM ${kkm}</span>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th style="width:36px;">No</th><th>Nama Siswa</th><th style="width:70px;">NIS</th><th style="width:140px;">Nilai</th><th>Keterangan</th></tr></thead>
        <tbody>
        ${list.map((s,i)=>{
          const v = nilaiDraft[s.id];
          const below = v!=="" && Number(v) < kkm;
          return `<tr>
            <td class="cell-mono">${i+1}</td>
            <td class="cell-strong">${esc(s.nama)}</td>
            <td class="cell-mono">${esc(s.nis)}</td>
            <td><input type="number" min="0" max="100" value="${esc(v)}" oninput="setNilaiVal('${s.id}', this.value)" style="${below?'border-color:var(--danger);':''}"></td>
            <td>${v!==""? (below?'<span class="badge badge-danger">Di bawah KKM</span>':'<span class="badge badge-success">Tuntas</span>') : '<span class="badge badge-muted">Belum diisi</span>'}</td>
          </tr>`;
        }).join("")}
        </tbody>
      </table></div>
      <div style="display:flex;justify-content:flex-end;margin-top:16px;">
        <button class="btn btn-tint" style="background:${MENU_COLORS.nilai};color:#fff;" onclick="saveNilai()">${icon('check',14)} Simpan Nilai</button>
      </div>
    </div>
  `;
}
function setNilaiVal(siswaId, val){
  nilaiDraft[siswaId] = val;
}
function onNilaiFilterChange(){
  nilaiSel.kelasId = document.getElementById("nilKelas").value;
  nilaiSel.mapelId = document.getElementById("nilMapel").value;
  nilaiSel.jenis = document.getElementById("nilJenis").value;
  nilaiSel.tanggal = document.getElementById("nilTanggal").value || todayISO();
  if(nilaiSel.kelasId && nilaiSel.mapelId) loadNilaiDraft();
  renderNilaiList();
}
async function saveNilai(){
  state.nilai = state.nilai.filter(n=>!(n.tanggal===nilaiSel.tanggal && n.kelasId===nilaiSel.kelasId && n.mapelId===nilaiSel.mapelId && n.jenis===nilaiSel.jenis));
  for(const siswaId in nilaiDraft){
    if(nilaiDraft[siswaId]==="" || nilaiDraft[siswaId]===null || nilaiDraft[siswaId]===undefined) continue;
    state.nilai.push({
      id: uid(),
      tanggal: nilaiSel.tanggal,
      kelasId: nilaiSel.kelasId,
      mapelId: nilaiSel.mapelId,
      jenis: nilaiSel.jenis,
      siswaId,
      nilai: Number(nilaiDraft[siswaId]),
      semester: state.settings.semester,
      tahunAjaran: state.settings.tahunAjaran
    });
  }
  await saveModule("nilai");
  toast("Nilai berhasil disimpan");
}

function pageRekap(){

    <div class="section-head"><h3>Filter Laporan</h3></div>
    <div class="field-row" style="grid-template-columns:1fr 1fr 1fr 1fr;">
      <div class="field" style="margin-bottom:0;">

        <select id="rekKelas" onchange="onRekapFilterChange()">

      </div>

          ${state.mapel.map(m=>`<option value="${m.id}" ${rekapSel.mapelId===m.id?'selected':''}>${esc(m.nama)}</option>`).join("")}

      </div>
      <div class="field" style="margin-bottom:0;">
        <label>Dari Tanggal</label>
        <input type="date" id="rekDari" value="${esc(rekapSel.dari)}" onchange="onRekapFilterChange()">

      <button class="tab-btn ${rekapSel.tab==='absensi'?'active':''}" onclick="setRekapTab('absensi')">Rekap Absensi</button>
      <button class="tab-btn ${rekapSel.tab==='nilai'?'active':''}" onclick="setRekapTab('nilai')">Rekap Nilai</button>

function setRekapTab(tab){ rekapSel.tab = tab; render(); }
function onRekapFilterChange(){
  rekapSel.kelasId = document.getElementById("rekKelas").value;
  rekapSel.mapelId = document.getElementById("rekMapel").value;
  rekapSel.dari = document.getElementById("rekDari").value;
  rekapSel.sampai = document.getElementById("rekSampai").value;
  renderRekapOutput();
}

function printHeaderHtml(judul){
  return `
  <div class="print-only" style="margin-bottom:18px;text-align:center;border-bottom:2px solid #1D2B29;padding-bottom:12px;">
    <img src="${LOGO_DATA_URI}" alt="Logo Sekolah" style="width:64px;height:64px;object-fit:cover;border-radius:50%;margin-bottom:8px;">
    <div style="font-weight:700;font-size:16px;">${esc(state.settings.namaSekolah)}</div>
    <div style="font-size:12px;">${esc(state.settings.alamat)}</div>
    <div style="font-weight:600;font-size:14px;margin-top:8px;text-decoration:underline;">${esc(judul)}</div>
  </div>`;
}

function renderRekapOutput(){
  const wrap = document.getElementById("rekapOutput");
  if(!wrap) return;
  if(!rekapSel.kelasId){
    wrap.innerHTML = `<div class="card card-pad"><div class="empty-state">${icon('rekap',40)}<div class="et">Pilih kelas terlebih dahulu</div><div>Pilih kelas dan rentang tanggal untuk menampilkan rekap.</div></div></div>`;
    return;
  }
  const list = siswaByKelas(rekapSel.kelasId);
  const inRange = (t) => t >= rekapSel.dari && t <= rekapSel.sampai;

  if(rekapSel.tab==="absensi"){
    const recs = state.absensi.filter(a=>a.kelasId===rekapSel.kelasId && inRange(a.tanggal) && (!rekapSel.mapelId || a.mapelId===rekapSel.mapelId));
    const rows = list.map(s=>{
      const rs = recs.filter(r=>r.siswaId===s.id);
      const hadir = rs.filter(r=>r.status==="Hadir").length;
      const izin = rs.filter(r=>r.status==="Izin").length;
      const sakit = rs.filter(r=>r.status==="Sakit").length;
      const alpa = rs.filter(r=>r.status==="Alpa").length;
      const total = rs.length;
      const persen = total ? Math.round((hadir/total)*100) : 0;
      return {s, hadir, izin, sakit, alpa, total, persen};
    });
    wrap.innerHTML = `
      <div class="card card-pad">
        ${printHeaderHtml("Rekap Absensi Siswa — "+kelasLabel(rekapSel.kelasId)+(rekapSel.mapelId?(" — "+mapelLabel(rekapSel.mapelId)):"")+" ("+fmtDate(rekapSel.dari)+" s/d "+fmtDate(rekapSel.sampai)+")")}
        <div class="section-head no-print"><h3>Rekap Absensi — ${esc(kelasLabel(rekapSel.kelasId))}</h3>
          <button class="btn btn-tint btn-sm" style="background:${MENU_COLORS.rekap};color:#fff;" onclick="window.print()">${icon('print',14)} Cetak Laporan</button>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>No</th><th>NIS</th><th>Nama Siswa</th><th>Hadir</th><th>Izin</th><th>Sakit</th><th>Alpa</th><th>% Kehadiran</th></tr></thead>
          <tbody>
            ${rows.map((r,i)=>`<tr>
              <td class="cell-mono">${i+1}</td>
              <td class="cell-mono">${esc(r.s.nis)}</td>
              <td class="cell-strong">${esc(r.s.nama)}</td>
              <td>${r.hadir}</td><td>${r.izin}</td><td>${r.sakit}</td><td>${r.alpa}</td>
              <td>${r.total? `<span class="badge ${r.persen>=90?'badge-success':r.persen>=75?'badge-warn':'badge-danger'}">${r.persen}%</span>` : '<span class="badge badge-muted">–</span>'}</td>
            </tr>`).join("")}
          </tbody>
        </table></div>
      </div>`;
  } else if(rekapSel.tab==="nilai"){
    const recs = state.nilai.filter(n=>n.kelasId===rekapSel.kelasId && inRange(n.tanggal) && (!rekapSel.mapelId || n.mapelId===rekapSel.mapelId));
    const rows = list.map(s=>{
      const rs = recs.filter(n=>n.siswaId===s.id);
      const avg = rs.length ? (rs.reduce((a,b)=>a+Number(b.nilai),0)/rs.length).toFixed(1) : null;
      return {s, count: rs.length, avg};
    });
    wrap.innerHTML = `
      <div class="card card-pad">
        ${printHeaderHtml("Rekap Nilai Siswa — "+kelasLabel(rekapSel.kelasId)+(rekapSel.mapelId?(" — "+mapelLabel(rekapSel.mapelId)):"")+" ("+fmtDate(rekapSel.dari)+" s/d "+fmtDate(rekapSel.sampai)+")")}
        <div class="section-head no-print"><h3>Rekap Nilai — ${esc(kelasLabel(rekapSel.kelasId))}</h3>
          <button class="btn btn-tint btn-sm" style="background:${MENU_COLORS.rekap};color:#fff;" onclick="window.print()">${icon('print',14)} Cetak Laporan</button>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>No</th><th>NIS</th><th>Nama Siswa</th><th>Jumlah Penilaian</th><th>Rata-rata Nilai</th></tr></thead>
          <tbody>
            ${rows.map((r,i)=>`<tr>
              <td class="cell-mono">${i+1}</td>
              <td class="cell-mono">${esc(r.s.nis)}</td>
              <td class="cell-strong">${esc(r.s.nama)}</td>
              <td>${r.count}</td>
              <td>${r.avg!==null ? `<span class="badge ${r.avg>=75?'badge-success':'badge-danger'}">${r.avg}</span>` : '<span class="badge badge-muted">–</span>'}</td>
            </tr>`).join("")}
          </tbody>
        </table></div>
      </div>`;
  } else {
    const recs = state.jurnal.filter(j=>j.kelasId===rekapSel.kelasId && inRange(j.tanggal) && (!rekapSel.mapelId || j.mapelId===rekapSel.mapelId)).sort((a,b)=>a.tanggal.localeCompare(b.tanggal));
    wrap.innerHTML = `
      <div class="card card-pad">
        ${printHeaderHtml("Rekap Jurnal Mengajar — "+kelasLabel(rekapSel.kelasId)+(rekapSel.mapelId?(" — "+mapelLabel(rekapSel.mapelId)):"")+" ("+fmtDate(rekapSel.dari)+" s/d "+fmtDate(rekapSel.sampai)+")")}
        <div class="section-head no-print"><h3>Rekap Jurnal — ${esc(kelasLabel(rekapSel.kelasId))}</h3>
          <button class="btn btn-tint btn-sm" style="background:${MENU_COLORS.rekap};color:#fff;" onclick="window.print()">${icon('print',14)} Cetak Laporan</button>
        </div>
        ${recs.length ? `<div class="table-wrap"><table>
          <thead><tr><th>Tanggal</th><th>Jam Ke</th><th>Mapel</th><th>Capaian Pembelajaran</th><th>Tujuan Pembelajaran</th><th>Materi</th><th>Guru</th></tr></thead>
          <tbody>${recs.map(j=>`<tr><td class="cell-mono">${fmtDate(j.tanggal)}</td><td>${esc(j.jamKe||'-')}</td><td>${esc(mapelLabel(j.mapelId))}</td><td>${esc(j.capaianPembelajaran||'-')}</td><td>${esc(j.tujuanPembelajaran||'-')}</td><td>${esc(j.materi)}</td><td>${esc(j.guru)}</td></tr>`).join("")}</tbody>
        </table></div>` : `<div class="empty-state">${icon('jurnal',40)}<div class="et">Tidak ada jurnal pada periode ini</div></div>`}
      </div>`;
  }
}

async function saveSettings(){
  state.settings.namaSekolah = document.getElementById("setNama").value || DEFAULT_SETTINGS.namaSekolah;
  state.settings.npsn = document.getElementById("setNpsn").value;
  state.settings.alamat = document.getElementById("setAlamat").value;
  state.settings.kepalaSekolah = document.getElementById("setKepsek").value;
  state.settings.tahunAjaran = document.getElementById("setTahun").value;
  state.settings.semester = document.getElementById("setSemester").value;
  await saveModule("settings");
  toast("Pengaturan berhasil disimpan");
  render();
}

function waliKelasImportStatus(){
  let pending = 0;
  for(const kid in SEED_WALI_KELAS){
    const k = state.kelas.find(x=>x.id===kid);
    const w = SEED_WALI_KELAS[kid];
    if(k && (k.waliKelas||"") !== w.nama){ pending++; }
  }
  return { pending, done: pending===0 };
}

async function importWaliKelas(){
  const st = waliKelasImportStatus();
  if(st.done){ toast("Data wali kelas sudah sesuai & lengkap"); return; }
  confirmDelete(`Terapkan data wali kelas untuk ${st.pending} kelas sesuai SK Pembagian Tugas Guru T.P. 2025/2026? Wali kelas yang sudah tercatat akan diperbarui.`, async ()=>{
    let updated = 0;
    for(const kid in SEED_WALI_KELAS){
      const k = state.kelas.find(x=>x.id===kid);
      const w = SEED_WALI_KELAS[kid];
      if(k){
        k.waliKelas = w.nama;
        k.nipWaliKelas = w.nip || "";
        updated++;
      }
    }
    await saveModule("kelas");
    toast(`Berhasil memperbarui wali kelas untuk ${updated} kelas`);
    render();
  });
}

function jadwalXLainnyaImportStatus(){
  const xKelasIds = new Set(["k-x-2","k-x-3","k-x-4","k-x-5","k-x-6","k-x-7","k-x-8","k-x-9","k-x-10"]);
  const existingKeys = new Set(state.jadwal.filter(j=>xKelasIds.has(j.kelasId)).map(j=>`${j.kelasId}|${j.hari}|${j.jamMulai}`));
  const jadwalNew = SEED_JADWAL_X_LAINNYA.filter(j=>!existingKeys.has(`${j.kelasId}|${j.hari}|${j.jamMulai}`)).length;

function exportBackup(){
  const backup = { settings: state.settings };
  for(const k of MODULE_KEYS) backup[k] = state[k];
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `backup-siakad-sman1-sbt-${todayISO()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast("Cadangan data diunduh");
}

function importBackup(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      confirmDelete("Mengimpor cadangan akan menimpa seluruh data saat ini. Lanjutkan?", async ()=>{
        if(data.settings) state.settings = {...DEFAULT_SETTINGS, ...data.settings};
        for(const k of MODULE_KEYS){
          state[k] = Array.isArray(data[k]) ? data[k] : [];
        }
        await saveModule("settings");
        for(const k of MODULE_KEYS) await saveModule(k);
        toast("Data berhasil dipulihkan dari cadangan");
        render();
      });
    }catch(err){
      toast("File cadangan tidak valid", true);
    }
  };
  reader.readAsText(file);
}

function resetAllData(){
  confirmDelete("Semua data (kelas, siswa, absensi, nilai, jurnal, catatan) akan dihapus permanen. Lanjutkan?", async ()=>{
    for(const k of MODULE_KEYS){
      state[k] = [];
      await saveModule(k);
    }
    toast("Seluruh data telah dihapus");
    render();
  });
}

async function autoImportAllSeeds(){
  let changedKelas=false, changedSiswa=false, changedMapel=false, changedJadwal=false;
  let newKelas=0, newSiswa=0, waliUpdated=0, newMapel=0, newJadwal=0;

  // 1. Data Peserta Didik (Dapodik)
  const kelasIdSet = new Set(state.kelas.map(k=>k.id));
  const siswaIdSet = new Set(state.siswa.map(s=>s.id));
  for(const k of SEED_DATA.kelas){ if(!kelasIdSet.has(k.id)){ state.kelas.push({...k}); newKelas++; changedKelas=true; } }
  for(const s of SEED_DATA.siswa){ if(!siswaIdSet.has(s.id)){ state.siswa.push({...s}); newSiswa++; changedSiswa=true; } }

  // 2. Wali Kelas
  for(const kid in SEED_WALI_KELAS){
    const k = state.kelas.find(x=>x.id===kid);
    const w = SEED_WALI_KELAS[kid];
    if(k && (k.waliKelas||"") !== w.nama){ k.waliKelas=w.nama; k.nipWaliKelas=w.nip||""; waliUpdated++; changedKelas=true; }
  }

  const hasMapel = (id) => state.mapel.some(m=>m.id===id);

  // 3. Mapel + Jadwal Kelas X-1
  for(const m of SEED_MAPEL){ if(!hasMapel(m.id)){ state.mapel.push({...m}); newMapel++; changedMapel=true; } }
  {
    const existingKeys = new Set(state.jadwal.filter(j=>j.kelasId==="k-x-1").map(j=>`${j.hari}|${j.jamMulai}`));
    for(const j of SEED_JADWAL_X1){
      const key = `${j.hari}|${j.jamMulai}`;
      if(existingKeys.has(key)) continue;
      const mapel = state.mapel.find(m=>m.kode===j.mapelKode);
      state.jadwal.push({id:uid(), hari:j.hari, jamMulai:j.jamMulai, jamSelesai:j.jamSelesai, kelasId:"k-x-1", mapelId: mapel?mapel.id:"", guru:j.guru});
      newJadwal++; changedJadwal=true;
    }
  }

  // 3b. Jadwal Kelas X-2 s/d X-10 (mapel sama dengan kelas X-1, tidak perlu mapel baru)
  {
    const xLainnyaIds = new Set(["k-x-2","k-x-3","k-x-4","k-x-5","k-x-6","k-x-7","k-x-8","k-x-9","k-x-10"]);
    const existingKeys = new Set(state.jadwal.filter(j=>xLainnyaIds.has(j.kelasId)).map(j=>`${j.kelasId}|${j.hari}|${j.jamMulai}`));
    for(const j of SEED_JADWAL_X_LAINNYA){
      const key = `${j.kelasId}|${j.hari}|${j.jamMulai}`;
      if(existingKeys.has(key)) continue;
      state.jadwal.push({id:uid(), hari:j.hari, jamMulai:j.jamMulai, jamSelesai:j.jamSelesai, kelasId:j.kelasId, mapelId:j.mapelId, guru:j.guru});
      newJadwal++; changedJadwal=true;
    }
  }

  // 4. Mapel + Jadwal Kelas XII (7 kelas)
  for(const m of SEED_MAPEL_XII){ if(!hasMapel(m.id)){ state.mapel.push({...m}); newMapel++; changedMapel=true; } }
  {
    const xiiIds = new Set(["k-xii-1","k-xii-2","k-xii-3","k-xii-4","k-xii-5","k-xii-6","k-xii-7"]);
    const existingKeys = new Set(state.jadwal.filter(j=>xiiIds.has(j.kelasId)).map(j=>`${j.kelasId}|${j.hari}|${j.jamMulai}`));
    for(const j of SEED_JADWAL_XII){
      const key = `${j.kelasId}|${j.hari}|${j.jamMulai}`;
      if(existingKeys.has(key)) continue;
      state.jadwal.push({id:uid(), hari:j.hari, jamMulai:j.jamMulai, jamSelesai:j.jamSelesai, kelasId:j.kelasId, mapelId:j.mapelId, guru:j.guru});
      newJadwal++; changedJadwal=true;
    }
  }

  // 5. Mapel + Jadwal Kelas XI (8 kelas)
  for(const m of SEED_MAPEL_XI){ if(!hasMapel(m.id)){ state.mapel.push({...m}); newMapel++; changedMapel=true; } }
  {
    const xiIds = new Set(["k-xi-1","k-xi-2","k-xi-3","k-xi-4","k-xi-5","k-xi-6","k-xi-7","k-xi-8"]);
    const existingKeys = new Set(state.jadwal.filter(j=>xiIds.has(j.kelasId)).map(j=>`${j.kelasId}|${j.hari}|${j.jamMulai}`));
    for(const j of SEED_JADWAL_XI){
      const key = `${j.kelasId}|${j.hari}|${j.jamMulai}`;
      if(existingKeys.has(key)) continue;
      state.jadwal.push({id:uid(), hari:j.hari, jamMulai:j.jamMulai, jamSelesai:j.jamSelesai, kelasId:j.kelasId, mapelId:j.mapelId, guru:j.guru});
      newJadwal++; changedJadwal=true;
    }
  }

  if(changedKelas) await saveModule("kelas");
  if(changedSiswa) await saveModule("siswa");
  if(changedMapel) await saveModule("mapel");
  if(changedJadwal) await saveModule("jadwal");

  const total = newKelas+newSiswa+waliUpdated+newMapel+newJadwal;
  if(total>0){
    toast(`Data referensi sekolah dimuat otomatis: ${newSiswa} siswa, ${newKelas} kelas, ${newMapel} mapel, ${newJadwal} sesi jadwal`);
  }
}

function mountDashboard(){
  const ctx = document.getElementById("attChart");
  if(!ctx || typeof Chart === "undefined") return;
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date();
    d.setDate(d.getDate()-i);
    days.push(d.toISOString().slice(0,10));
  }
  const data = days.map(d=>{
    const recs = state.absensi.filter(a=>a.tanggal===d);
    if(!recs.length) return null;
    return Math.round((recs.filter(r=>r.status==="Hadir").length/recs.length)*100);
  });
  if(attendanceChart) attendanceChart.destroy();
  attendanceChart = new Chart(ctx, {
    type:'bar',
    data:{
      labels: days.map(d=>new Date(d+"T00:00:00").toLocaleDateString('id-ID',{weekday:'short'})),
      datasets:[{
        label:'% Hadir',
        data,
        backgroundColor:'#C97A2B',
        borderRadius:6,
        maxBarThickness:36
      }]
    },
    options:{
      responsive:true,
      plugins:{ legend:{display:false} },
      scales:{ y:{ min:0, max:100, ticks:{ callback:v=>v+'%' }, grid:{color:'#EFEBDF'} }, x:{ grid:{display:false} } }
    }
  });
}
